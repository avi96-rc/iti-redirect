<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opening ITI Electrician...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            margin: 0;
            padding: 20px;
            text-align: center;
            background-color: #f8f9fa;
            color: #212529;
        }
        .card {
            background: #ffffff;
            padding: 32px 24px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            max-width: 400px;
            width: 100%;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #e9ecef;
            border-top: 4px solid #007bff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 {
            font-size: 20px;
            margin: 0 0 10px 0;
        }
        p {
            font-size: 14px;
            color: #6c757d;
            margin: 0 0 24px 0;
        }
        .btn {
            display: inline-block;
            background-color: #007bff;
            color: #ffffff;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            border-radius: 8px;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="spinner"></div>
        <h2>Opening ITI Electrician App...</h2>
        <p>If the app does not open automatically, click the button below:</p>
        <a id="fallback" class="btn" href="#">Open App</a>
    </div>

    <script>
        (function() {
            var search = window.location.search || "";
            var params = new URLSearchParams(search);
            var section = (params.get("section") || params.get("type") || "mcq").toLowerCase();
            
            // Build custom URI scheme
            var targetUri = "itielectrician://" + encodeURIComponent(section) + search;
            
            var fallbackBtn = document.getElementById("fallback");
            if (fallbackBtn) {
                fallbackBtn.href = targetUri;
            }

            // Trigger redirection
            window.location.href = targetUri;
        })();
    </script>
</body>
</html>

name: Post Daily Quiz to Telegram

on:
  schedule:
    # 09:00 AM IST (03:30 UTC) - Morning Daily MCQ Quiz
    - cron: '30 3 * * *'
    # 06:00 PM IST (12:30 UTC) - Evening Subject-Wise Special Quiz
    - cron: '30 12 * * *'
  workflow_dispatch:

jobs:
  post-to-telegram:
    runs-on: ubuntu-latest
    steps:
      - name: Send Scheduled Quiz to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - << 'EOF'
          import os
          import sys
          import datetime
          import urllib.request
          import json

          bot_token = os.environ.get("BOT_TOKEN", "").strip()
          chat_id = os.environ.get("CHAT_ID", "").strip()

          if not bot_token:
              print("❌ ERROR: TELEGRAM_BOT_TOKEN secret is empty or missing.")
              sys.exit(1)

          if not chat_id:
              print("❌ ERROR: TELEGRAM_CHAT_ID secret is empty or missing.")
              sys.exit(1)

          # Convert to Indian Standard Time (IST = UTC + 5:30)
          ist_tz = datetime.timezone(datetime.timedelta(hours=5, minutes=30))
          now_ist = datetime.datetime.now(ist_tz)

          is_morning = now_ist.hour < 14  # Morning (< 2 PM) vs Evening (>= 2 PM)
          weekday = now_ist.weekday()      # 0=Mon, 1=Tue, 2=Wed, 3=Thu, 4=Fri, 5=Sat, 6=Sun
          day_index = int(now_ist.timestamp()) // 86400

          if is_morning:
              # 09:00 AM IST: Daily MCQ Challenge (Sets 1 to 83)
              set_num = (day_index % 83) + 1
              redirect_url = f"https://avi96-rc.github.io/iti-redirect/?section=mcq&set={set_num}"
              header_text = "⚡ <b>ITI Electrician Daily Morning Quiz!</b>"
              desc_text = f"आज का टेस्ट: <b>MCQ Set #{set_num}</b>\n15 महत्वपूर्ण प्रश्नों का अभ्यास करें और अपनी तैयारी जांचें।"
              cta_text = f"👉 <a href=\"{redirect_url}\">Tap here to open Set {set_num} in App</a>"
          else:
              # 06:00 PM IST: Subject-Wise Rotation
              if weekday == 0:  # Monday: Chapterwise Theory
                  set_num = (day_index % 22) + 1
                  redirect_url = f"https://avi96-rc.github.io/iti-redirect/?section=chapterwise&set={set_num}"
                  header_text = "📖 <b>Monday Special: अध्यायवार थ्योरी टेस्ट</b>"
                  desc_text = f"आज का अध्याय: <b>Chapter #{set_num}</b>\nट्रेड थ्योरी के महत्वपूर्ण प्रश्नों का अभ्यास करें।"
                  cta_text = f"👉 <a href=\"{redirect_url}\">Tap here to open Chapter {set_num} in App</a>"
              elif weekday == 1:  # Tuesday: Engineering Drawing
                  set_num = (day_index % 11) + 1
                  redirect_url = f"https://avi96-rc.github.io/iti-redirect/?section=ed&set={set_num}"
                  header_text = "📐 <b>Tuesday Special: इंजीनियरिंग ड्राइंग (ED)</b>"
                  desc_text = f"आज का टेस्ट: <b>ED Set #{set_num}</b>\nचित्र और सिम्बल आधारित महत्वपूर्ण प्रश्न।"
                  cta_text = f"👉 <a href=\"{redirect_url}\">Tap here to open ED Set {set_num} in App</a>"
              elif weekday == 2:  # Wednesday: Workshop Calculation & Science
                  set_num = (day_index % 10) + 1
                  redirect_url = f"https://avi96-rc.github.io/iti-redirect/?section=workshop&set={set_num}"
                  header_text = "⚙️ <b>Wednesday Special: कार्यशाला गणना एवं विज्ञान (WCS)</b>"
                  desc_text = f"आज का टेस्ट: <b>Workshop Calculation Set #{set_num}</b>\nन्यूमेरिकल और साइंस के महत्वपूर्ण प्रश्न।"
                  cta_text = f"👉 <a href=\"{redirect_url}\">Tap here to open Workshop Set {set_num} in App</a>"
              elif weekday == 3:  # Thursday: Employability Skills
                  set_num = (day_index % 5) + 1
                  redirect_url = f"https://avi96-rc.github.io/iti-redirect/?section=employability&set={set_num}"
                  header_text = "💼 <b>Thursday Special: एम्प्लॉयबिलिटी स्किल्स (ES)</b>"
                  desc_text = f"आज का टेस्ट: <b>Employability Skills Set #{set_num}</b>\nCBT परीक्षा में 100% स्कोर करने के लिए अभ्यास करें।"
                  cta_text = f"👉 <a href=\"{redirect_url}\">Tap here to open ES Set {set_num} in App</a>"
              elif weekday == 4:  # Friday: Short Notes
                  set_num = (day_index % 18) + 1
                  redirect_url = f"https://avi96-rc.github.io/iti-redirect/?section=notes&set={set_num}"
                  header_text = "📝 <b>Friday Special: शॉर्ट नोट्स एवं मुख्य सूत्र</b>"
                  desc_text = f"आज का टॉपिक: <b>Notes Set #{set_num}</b>\nकम समय में पूरे विषय का त्वरित रिवीज़न करें।"
                  cta_text = f"👉 <a href=\"{redirect_url}\">Tap here to open Notes Set {set_num} in App</a>"
              elif weekday == 5:  # Saturday: One Liner
                  set_num = (day_index % 103) + 1
                  redirect_url = f"https://avi96-rc.github.io/iti-redirect/?section=oneliner&set={set_num}"
                  header_text = "💡 <b>Saturday Special: वन-लाइनर प्रश्नोत्तरी (One Liner)</b>"
                  desc_text = f"आज का टेस्ट: <b>One Liner Set #{set_num}</b>\nसीधे सवाल और सटीक जवाब से अपनी मेमोरी तेज़ करें।"
                  cta_text = f"👉 <a href=\"{redirect_url}\">Tap here to open One Liner Set {set_num} in App</a>"
              else:  # Sunday: Weekly Mega Mock Test
                  set_num = (day_index % 83) + 1
                  redirect_url = f"https://avi96-rc.github.io/iti-redirect/?section=mcq&set={set_num}"
                  header_text = "🎯 <b>Sunday Special: वीकली मेगा मॉक टेस्ट</b>"
                  desc_text = f"आज का टेस्ट: <b>Mock Test Set #{set_num}</b>\nअपनी पूरे हफ्ते की तैयारी का आकलन करें।"
                  cta_text = f"👉 <a href=\"{redirect_url}\">Tap here to open Set {set_num} in App</a>"

          message = (
              f"{header_text}\n\n"
              f"{desc_text}\n\n"
              f"{cta_text}\n\n"
              f"<i>(Requires ITI Electrician App installed)</i>"
          )

          url = f"https://api.telegram.org/bot{bot_token}/sendMessage"
          payload = {
              "chat_id": chat_id,
              "text": message,
              "parse_mode": "HTML",
              "disable_web_page_preview": True
          }

          req = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"}
          )

          try:
              with urllib.request.urlopen(req) as response:
                  res_data = response.read().decode("utf-8")
                  print("✅ Successfully posted scheduled quiz to Telegram:", res_data)
          except urllib.error.HTTPError as e:
              err_msg = e.read().decode("utf-8")
              print(f"❌ Telegram API Error ({e.code}): {err_msg}")
              sys.exit(1)
          except Exception as e:
              print(f"❌ Unexpected Error: {str(e)}")
              sys.exit(1)
          EOF

name: Post Premium Section to Telegram (Manual)

on:
  workflow_dispatch: # Manual trigger only, no schedule

jobs:
  post-premium-section:
    runs-on: ubuntu-latest
    steps:
      - name: Send Premium Section Link to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - << 'EOF'
          import os
          import sys
          import urllib.request
          import json

          bot_token = os.environ.get("BOT_TOKEN", "").strip()
          chat_id = os.environ.get("CHAT_ID", "").strip()

          if not bot_token or not chat_id:
              print("❌ ERROR: Missing TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID secret.")
              sys.exit(1)

          redirect_url = "https://avi96-rc.github.io/iti-redirect/?section=premium"

          message = (
              "👑 <b>2025–2026 Bharat Skills (PRO) MCQ Series</b>\n\n"
              "NCVT CBT परीक्षा के लिए नवीनतम पैटर्न और पिछले वर्षों के महत्वपूर्ण प्रश्न (PYQ Sets 84 से 113)!\n\n"
              "📚 <b>विशेषताएँ:</b>\n"
              "• NIMI & Bharat Skills आधारित 30 स्पेशल प्रैक्टिस सेट्स\n"
              "• 1st & 2nd Year के लिए विशेष रूप से तैयार\n"
              "• CBT परीक्षा में सीधे पूछे जाने वाले प्रश्न\n\n"
              f"👉 <a href=\"{redirect_url}\">Tap here to open PRO Section in App</a>\n\n"
              "<i>(Requires ITI Electrician App installed)</i>"
          )

          url = f"https://api.telegram.org/bot{bot_token}/sendMessage"
          payload = {
              "chat_id": chat_id,
              "text": message,
              "parse_mode": "HTML",
              "disable_web_page_preview": True
          }

          req = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"}
          )

          try:
              with urllib.request.urlopen(req) as response:
                  res_data = response.read().decode("utf-8")
                  print("✅ Successfully posted Premium section to Telegram:", res_data)
          except urllib.error.HTTPError as e:
              err_msg = e.read().decode("utf-8")
              print(f"❌ Telegram API Error ({e.code}): {err_msg}")
              sys.exit(1)
          except Exception as e:
              print(f"❌ Unexpected Error: {str(e)}")
              sys.exit(1)
          EOF
